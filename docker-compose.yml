services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: enlace
      POSTGRES_PASSWORD: enlace_dev
      POSTGRES_DB: enlace_dev
    ports:
      - "5433:5432"
    volumes:
      - enlace_pg_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d

volumes:
  enlace_pg_data:
